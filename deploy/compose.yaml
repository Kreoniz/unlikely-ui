services:
  showcase:
    image: ${CADDY_IMAGE:?Set the approved Caddy image ID or digest}
    pull_policy: never
    restart: unless-stopped
    user: '65534:65534'
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 64
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/showcase:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /config:size=1m,mode=1777
      - /data:size=1m,mode=1777
    networks:
      edge:
        aliases: [unlikely-ui-showcase]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/index.html]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'

networks:
  edge:
    external: true
    name: beszel-edge
